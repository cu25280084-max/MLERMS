<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MLERMS</title>


    <style>
        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background-image: linear-gradient(90deg,
                rgba(5, 12, 15, 0.78),
                rgba(5, 12, 15, 0.35),
                rgba(5, 12, 15, 0.72)),
            url("{{ url_for('static', filename='images/login-bg.png') }}");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }


        /* =========================================
           BACKGROUND DARKENING
           ========================================= */

        .background-overlay {

            position: fixed;

            inset: 0;

            background:
                linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.10),
                    rgba(0, 0, 0, 0.28));

            pointer-events: none;
        }


        /* =========================================
           LOGIN CONTAINER
           ========================================= */

        .login-wrapper {

            position: relative;

            width: 100%;
            max-width: 480px;

            padding: 20px;

            z-index: 2;
        }


        /* =========================================
           GLASS LOGIN CARD
           ========================================= */

        .login-card {

            width: 100%;

            padding: 38px 42px 32px;

            background:
                linear-gradient(145deg,
                    rgba(13, 25, 27, 0.65),
                    rgba(7, 17, 19, 0.65));

            border: 1px solid rgba(255, 255, 255, 0.28);

            border-radius: 18px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);
        }


        /* =========================================
           LOGO
           ========================================= */

        .logo-container {

            text-align: center;

            margin-bottom: 18px;
        }


        .logo {

            width: 115px;
            height: 115px;

            object-fit: contain;

            display: block;

            margin: 0 auto 12px;

            filter:
                drop-shadow(0 5px 12px rgba(0, 0, 0, 0.45));
        }


        /* =========================================
           SYSTEM NAME
           ========================================= */

        .system-name {

            color: #ffffff;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: 3px;

            margin: 0;

            text-align: center;
        }


        .system-description {

            color: rgba(255, 255, 255, 0.70);

            font-size: 11px;

            font-weight: 500;

            letter-spacing: 2px;

            line-height: 1.6;

            text-align: center;

            margin-top: 6px;

            text-transform: uppercase;
        }


        /* =========================================
           DECORATIVE LINE
           ========================================= */

        .accent-line {

            width: 100%;

            height: 2px;

            margin: 24px 0 26px;

            background:
                linear-gradient(90deg,
                    #e46b2d 0%,
                    #e46b2d 35%,
                    #ffffff 35%,
                    #ffffff 65%,
                    #557b50 65%,
                    #557b50 100%);

            opacity: 0.9;
        }


        /* =========================================
           FORM
           ========================================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-label {

            display: block;

            color: rgba(255, 255, 255, 0.78);

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;

            letter-spacing: 0.4px;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            width: 19px;

            height: 19px;

            color: rgba(255, 255, 255, 0.62);

            pointer-events: none;
        }


        .form-input {

            width: 100%;

            height: 52px;

            padding:
                0 16px 0 48px;

            border-radius: 9px;

            border:
                1px solid rgba(255, 255, 255, 0.24);

            background:
                rgba(5, 14, 16, 0.42);

            color: #ffffff;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-input::placeholder {

            color:
                rgba(255, 255, 255, 0.42);
        }


        .form-input:focus {

            border-color:
                rgba(112, 164, 105, 0.90);

            background:
                rgba(5, 14, 16, 0.60);

            box-shadow:
                0 0 0 3px rgba(112, 164, 105, 0.14);
        }

        /* =========================================
   BROWSER AUTOFILL OVERRIDE
   ========================================= */

        .form-input:-webkit-autofill,
        .form-input:-webkit-autofill:hover,
        .form-input:-webkit-autofill:focus,
        .form-input:-webkit-autofill:active {

            -webkit-text-fill-color: #ffffff !important;

            -webkit-box-shadow:
                0 0 0 1000px rgba(5, 14, 16, 0.72) inset !important;

            box-shadow:
                0 0 0 1000px rgba(5, 14, 16, 0.72) inset !important;

            caret-color: #ffffff;

            transition:
                background-color 9999s ease-in-out 0s;
        }


        /* =========================================
           PASSWORD BUTTON
           ========================================= */

        .password-toggle {

            position: absolute;

            right: 12px;

            top: 50%;

            transform: translateY(-50%);

            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;

            background: transparent;

            color: rgba(255, 255, 255, 0.65);

            cursor: pointer;

            padding: 0;

            border-radius: 6px;

            transition:
                color 0.2s ease,
                background 0.2s ease;
        }


        .password-toggle svg {

            width: 21px;

            height: 21px;

            display: block;
        }


        .password-toggle:hover {

            color: #ffffff;

            background: rgba(255, 255, 255, 0.08);
        }


        .password-toggle:hover {

            color: #ffffff;
        }


        /* =========================================
           ERROR MESSAGE
           ========================================= */

        .error-message {

            background:
                rgba(180, 35, 35, 0.20);

            border:
                1px solid rgba(255, 100, 100, 0.40);

            color:
                #ffb5b5;

            border-radius: 8px;

            padding: 11px 13px;

            font-size: 13px;

            margin-bottom: 18px;

            text-align: center;
        }


        /* =========================================
           LOGIN BUTTON
           ========================================= */

        .login-button {

            width: 100%;

            height: 53px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(135deg,
                    #4d7049,
                    #355633);

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.7px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .login-button:hover {

            background:
                linear-gradient(135deg,
                    #5b8255,
                    #3e653b);

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.30);
        }


        .login-button:active {

            transform: translateY(0);
        }


        /* =========================================
           FOOTER
           ========================================= */

        .footer-line {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 27px;
        }


        .footer-line::before,
        .footer-line::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255, 255, 255, 0.28);
        }


        .footer-text {

            color:
                rgba(255, 255, 255, 0.52);

            font-size: 10px;

            letter-spacing: 2.4px;

            white-space: nowrap;
        }


        .copyright {

            color:
                rgba(255, 255, 255, 0.35);

            text-align: center;

            font-size: 10px;

            margin-top: 17px;
        }


        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            body {

                overflow-y: auto;

                padding: 20px 0;
            }


            .login-wrapper {

                max-width: 430px;

                padding: 15px;
            }


            .login-card {

                padding:
                    30px 25px 26px;
            }


            .logo {

                width: 90px;
                height: 90px;
            }


            .system-name {

                font-size: 23px;

                letter-spacing: 2px;
            }


            .system-description {

                font-size: 9px;

                letter-spacing: 1.5px;
            }
        }
    </style>

</head>


<body>


    <div class="background-overlay"></div>


    <div class="login-wrapper">


        <div class="login-card">


            <!-- =================================
                 LOGO
                 ================================= -->

            <div class="logo-container">

                <img src="{{ url_for('static', filename='images/mlerms-logo.png') }}" alt="MLERMS Logo" class="logo">


                <h1 class="system-name">
                    MLERMS
                </h1>


                <div class="system-description">

                    Military Logistics & Equipment
                    <br>
                    Readiness Management System

                </div>

            </div>


            <!-- ACCENT LINE -->

            <div class="accent-line"></div>


            <!-- =================================
                 ERROR
                 ================================= -->

            {% if error %}

            <div class="error-message">

                {{ error }}

            </div>

            {% endif %}


            <!-- =================================
                 LOGIN FORM
                 ================================= -->

            <form method="POST">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username" class="form-label">
                        USERNAME
                    </label>


                    <div class="input-wrapper">


                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8">

                            <path d="M20 21a8 8 0 0 0-16 0" />

                            <circle cx="12" cy="7" r="4" />

                        </svg>


                        <input type="text" id="username" name="username" class="form-input"
                            placeholder="Enter your username" autocomplete="username" required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password" class="form-label">
                        PASSWORD
                    </label>


                    <div class="input-wrapper">


                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8">

                            <rect x="4" y="10" width="16" height="11" rx="2" />

                            <path d="M8 10V7a4 4 0 0 1 8 0v3" />

                        </svg>


                        <input type="password" id="password" name="password" class="form-input"
                            placeholder="Enter your password" autocomplete="current-password" required
                            style="padding-right: 50px;">


                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                stroke-linecap="round" stroke-linejoin="round">

                                <!-- Eye -->
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />

                                <!-- Pupil -->
                                <circle cx="12" cy="12" r="2.8" />

                                <!-- Slash -->
                                <line id="eyeSlash" x1="3" y1="3" x2="21" y2="21" style="display: none;" />

                            </svg>
                        </button>

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="login-button">

                    LOGIN
                    <span style="margin-left: 8px;">
                        →
                    </span>

                </button>


            </form>


            <!-- =================================
                 FOOTER
                 ================================= -->

            <div class="footer-line">

                <span class="footer-text">
                    LOGISTICS ENABLES COMBAT POWER
                </span>

            </div>


            <div class="copyright">

                Military Logistics & Equipment Readiness Management System

            </div>


        </div>

    </div>


    <!-- =========================================
         PASSWORD SHOW / HIDE
         ========================================= -->

    <script>

        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const eyeSlash =
            document.getElementById("eyeSlash");


        passwordToggle.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                // Show password
                passwordInput.type = "text";

                // Show slash
                eyeSlash.style.display = "block";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                // Hide password
                passwordInput.type = "password";

                // Hide slash
                eyeSlash.style.display = "none";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        });

    </script>


</body>

</html>
