<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MLERMS{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
    <style>

        .session-timer {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 9px;
            background: rgba(255,255,255,.055);
            color: rgba(255,255,255,.82);
            font-size: 12px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .session-timer .timer-value { color: #dcebdc; font-weight: 700; }
        .session-timer.warning { border-color: rgba(255,190,90,.45); }
        .session-timer.warning .timer-value { color: #ffd08a; }
        .session-timer.critical { border-color: rgba(255,100,100,.55); }
        .session-timer.critical .timer-value { color: #ffaaaa; }
        @media (max-width: 760px) {
            .session-timer { padding: 6px 8px; font-size: 11px; gap: 5px; }
        }
        @media (max-width: 560px) {
            .session-timer .timer-label { display: none; }
        }
        .brand-home-link {
            color: inherit;
            text-decoration: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity .16s ease;
        }
        .brand-home-link:hover { opacity: .94; }
        .brand-home-link:focus-visible {
            outline: 2px solid #d5e8dc;
            outline-offset: 5px;
        }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="mlerms-app">
    <header class="topbar">
        <a class="brand brand-home-link" href="/" aria-label="MLERMS main dashboard">
            <img class="brand-logo"
                 src="{{ url_for('static', filename='images/mlerms-logo.png') }}"
                 alt="MLERMS Logo"
                 onerror="this.style.display='none';">
            <div class="brand-copy">
                <div class="brand-name">MLERMS</div>
                <small>Military Logistics &amp; Equipment Readiness Management System</small>
            </div>
        </a>
        <div class="user-area">
            <div class="session-timer" id="sessionTimer"
                 data-last-activity="{{ session.get('last_activity', 0) }}"
                 data-timeout-seconds="900"
                 data-login-url="{{ url_for('auth.login', timeout=1) }}"
                 role="status" aria-live="off">
                <span aria-hidden="true">◷</span>
                <span class="timer-label">Session expires in</span>
                <span class="timer-value" id="sessionTimerValue">15:00</span>
            </div>
            <div class="user-welcome">
                <span class="welcome-label">Welcome</span>
                <strong>{{ session.get("username", "") }}</strong>
            </div>
            <a class="logout" href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>

<script>
(function () {
    const timer = document.getElementById("sessionTimer");
    const value = document.getElementById("sessionTimerValue");
    if (!timer || !value) return;

    const timeoutSeconds = Number(timer.dataset.timeoutSeconds || 900);
    const loginUrl = timer.dataset.loginUrl;
    let lastActivityMs = Number(timer.dataset.lastActivity || 0) * 1000;
    if (!lastActivityMs || !Number.isFinite(lastActivityMs)) lastActivityMs = Date.now();

    let lastPingMs = 0;
    let pingInFlight = false;
    const pingThrottleMs = 10000;

    function formatTime(totalSeconds) {
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    function drawTimer() {
        const elapsed = Math.floor((Date.now() - lastActivityMs) / 1000);
        const remaining = Math.max(0, timeoutSeconds - elapsed);
        value.textContent = formatTime(remaining);
        timer.classList.toggle("warning", remaining <= 300 && remaining > 60);
        timer.classList.toggle("critical", remaining <= 60);

        if (remaining <= 0) {
            window.location.replace(loginUrl);
        }
    }

    async function reportActivity(force) {
        const now = Date.now();
        if (pingInFlight || (!force && now - lastPingMs < pingThrottleMs)) return;
        lastPingMs = now;
        pingInFlight = true;
        try {
            const response = await fetch("/session/activity", {
                method: "POST",
                credentials: "same-origin",
                headers: { "X-Requested-With": "XMLHttpRequest" }
            });
            if (response.status === 401 || response.redirected) {
                window.location.replace(loginUrl);
                return;
            }
        } catch (error) {
            // The server still enforces the timeout; the timer remains a visual indicator.
        } finally {
            pingInFlight = false;
        }
    }

    function registerActivity(event) {
        if (event && event.type === "mousemove") {
            // Avoid treating tiny cursor movements as meaningful activity.
            if (registerActivity.lastMove && Date.now() - registerActivity.lastMove < 1000) return;
            registerActivity.lastMove = Date.now();
        }
        lastActivityMs = Date.now();
        drawTimer();
        reportActivity(false);
    }

    ["pointerdown", "keydown", "touchstart", "click", "input", "mousemove"].forEach(function (eventName) {
        document.addEventListener(eventName, registerActivity, { passive: true });
    });

    drawTimer();
    window.setInterval(drawTimer, 1000);
})();
</script>

    {% block scripts %}{% endblock %}
</body>
</html>
